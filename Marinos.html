                        <button id="prevButton" class="button2">Anterior</button>
                    </div>

                        <iframe id="sketchfab-embed" allowfullscreen></iframe>
                        <div class="buttons-container">
                            <button id="nextButton" class="button2">Siguiente</button>
                        </div>
                    </div>
                </div>
            
                <style>
                    .container {
                        display: flex;
                        justify-content: center;
                    }
            
                    .sketch-and-buttons {
                        display: flex;
                        align-items: center;
                        gap: 10px; /* Reducir el espacio entre el iframe y los botones */
                    }
            
                    #sketchfab-embed {
                        width: 800px; /* Ajusta el ancho del iframe */
                        height: 500px; /* Ajusta la altura del iframe */
                        border: none;
                    }
            
                    .buttons-container {
                        display: flex;
                        align-items: center; /* Alinea los botones verticalmente */
                    }
            
                    .button2 {
                        padding: 10px;
                        margin: 5px;
                        cursor: pointer;
                        background-color: rgb(220, 10, 49);
                        color: white;
                        border: none;
                        border-radius: 5px;
                        width: 120px; /* Igualar el tamaño de los botones */
                        height: 40px; /* Definir la altura de los botones */
                    }
            
                    .button2:hover {
                        background-color: rgb(220, 10, 49);
                    }
                </style>
            
                <script>
                    const models = [
                    'https://sketchfab.com/models/cd87eb7221374b29b689ede59a38bab4/embed',
                    'https://sketchfab.com/models/5dfdaf06b89444078046c2c1ccbad721/embed',
                    'https://sketchfab.com/models/d367469ed3ef4f45bfab2361901ca86c/embed',
                    'https://sketchfab.com/models/b811cc211a9c490c956bcdcdffaff5db/embed',
                    'https://sketchfab.com/models/d0222404f30540c0a82411d7fca408ca/embed',
                    'https://sketchfab.com/models/a799b41ce70148b7a88e99423bf672dd/embed',
                    'https://sketchfab.com/models/f7260e0c0e594e07a7ae09c38608ffa9/embed',
                    'https://sketchfab.com/models/c72b8b01f2a04d898da1de68d4a4fde8/embed',
                    'https://sketchfab.com/models/9c06219c8c2443c78546fbde036eb246/embed',
                    'https://sketchfab.com/models/9196771b893c42cbb8fe79f97b6238e7/embed',
                    'https://sketchfab.com/models/a6a5d8a7b74d4959a11742cd3cd6af45/embed',
                    'https://sketchfab.com/models/51e087d4a6874ee4ab1b8806d91ecbed/embed',
                    'https://sketchfab.com/models/0cbb3831287943a1a45a7ab444d667b8/embed',
                    'https://sketchfab.com/models/c83ef99ff4884287b8ed9e1468cabba6/embed',
                    'https://sketchfab.com/models/e188b3165ffd4c5b99814a14edb94bb4/embed',                    
                    'https://sketchfab.com/models/2e0683181d894edaab3e18dba58ae4d2/embed',
                    'https://sketchfab.com/models/54857854c4af495e90349d9b66fbf95d/embed'
                                            ];
                    let currentModelIndex = 0;
            
                    const iframe = document.getElementById('sketchfab-embed');
                    const prevButton = document.getElementById('prevButton');
                    const nextButton = document.getElementById('nextButton');
            
                    function updateModel() {
                        iframe.src = models[currentModelIndex];
                    }
            
                    prevButton.addEventListener('click', () => {
                        currentModelIndex = (currentModelIndex - 1 + models.length) % models.length;
                        updateModel();
                    });
            
                    nextButton.addEventListener('click', () => {
                        currentModelIndex = (currentModelIndex + 1) % models.length;
                        updateModel();
                    });
            
                    // Inicializar con el primer modelo
                    updateModel();
                </script>
