    <script src="meta.js"></script>


    <script>
        // Función que reemplaza la miniatura con el iframe de Spatial.io para visualizar los recorridos
        function loadTour(tourId, videoUrl) {
            const thumbnail = document.getElementById(tourId); // Obtiene el elemento de la miniatura
            const iframe = document.createElement('iframe'); // Crea un iframe
            iframe.setAttribute('src', videoUrl); // Establece la URL del recorrido en el iframe
            iframe.setAttribute('frameborder', '0'); // Elimina el borde del iframe
            iframe.setAttribute('allowfullscreen', '1'); // Permite la pantalla completa
            iframe.setAttribute('allow', 'camera; microphone; vr; autoplay; encrypted-media'); // Permisos del iframe

            // Reemplaza la miniatura por el iframe del recorrido virtual
            thumbnail.innerHTML = ''; // Limpia el contenido de la miniatura
            thumbnail.appendChild(iframe); // Inserta el iframe en su lugar
        }

        // Asignar a cada recorrido su evento para cargar el iframe correspondiente al hacer clic
        document.getElementById('tour-1').addEventListener('click', function() {
            loadTour('tour-1', 'https://ingenieria-unam.netlify.app/');
        });

        document.getElementById('tour-2').addEventListener('click', function() {
            loadTour('tour-2', 'https://kuula.co/share/collection/7JJqT?logo=0&info=0&fs=1&vr=1&sd=1&initload=0&thumbs=1');
        });

    </script>
